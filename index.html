<!DOCTYPE html>
<html>
<head>
  <title>Retro Arcade</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }

    canvas {
      display: block;
      background-color: #000;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600" aria-label="Colorful pixel invaders, defensive barriers, and a white player ship on a black background">
    Colorful pixel invaders, defensive barriers, and a white player ship on a black background.
  </canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    if (!(canvas instanceof HTMLCanvasElement)) {
      throw new Error("Unable to find the game canvas.");
    }

    const context = canvas.getContext("2d");
    if (!context) {
      throw new Error("Unable to draw on the canvas.");
    }

    const invaderFrames = [
      [
        ["..##..##", "..##..##", ".######.", "########", "##.##.##", "########", ".##..##."],
        ["..##..##", ".######.", "########", "##.##.##", "########", ".##..##.", "##....##"]
      ],
      [
        ["...##...", "..####..", ".######.", "########", "##.##.##", "########", "##....##"],
        ["..####..", ".######.", "##.##.##", "########", ".######.", "##.##.##", ".##..##."]
      ],
      [
        ["..####..", ".######.", "########", "##.##.##", "########", "..#..#..", ".##..##."],
        [".##..##.", "########", "##.##.##", "########", ".######.", "##....##", "..#..#.."]
      ]
    ];
    const invaderCellSize = 3;
    const invaderWidth = invaderFrames[0][0][0].length * invaderCellSize;
    const invaderHeight = invaderFrames[0][0].length * invaderCellSize;
    const invaderHitboxInsetX = 4;
    const invaderHitboxInsetY = 3;
    const invaderColumns = 8;
    const invaderGapX = 26;
    const invaderGapY = 18;
    const formationWidth = invaderColumns * invaderWidth + (invaderColumns - 1) * invaderGapX;
    const invaderColors = ["#7dff4e", "#42f2a0", "#b8ff55"];
    const invaderEyeColors = ["#fff078", "#a6fff0", "#fff19a"];
    const invaderSpeed = 55;
    const invaderStepDown = 16;
    let formationX = (canvas.width - formationWidth) / 2;
    let formationY = 60;
    let formationDirection = 1;
    const invaders = invaderFrames.map(() => Array(invaderColumns).fill(true));
    const barrierCellSize = 6;
    const barrierPattern = [
      "....##....",
      "...####...",
      "..######..",
      "##########",
      "##########",
      "###....###"
    ];
    const barriers = [70, 260, 450, 640].map((x) => ({
      x,
      y: 440,
      cells: barrierPattern.map((row) => row.split("").map((pixel) => pixel === "#"))
    }));
    const playerBullets = [];
    const invaderBullets = [];
    const playerBulletSpeed = 420;
    const invaderBulletSpeed = 190;
    const playerFireInterval = 0.24;
    const invaderFireInterval = 0.8;
    const minimumInvaderFireInterval = 0.3;
    const invaderFireSpeedupPerKill = 0.06;
    let playerFireTimer = playerFireInterval;
    let invaderFireTimer = 0;
    let nextShooterColumn = 0;
    let playerLives = 3;
    let score = 0;
    let gameOver = false;

    const pressedKeys = new Set();
    const shipWidth = 32;
    const shipHeight = 20;
    const shipSpeed = 300;
    const shipY = canvas.height - 60;
    let shipX = (canvas.width - shipWidth) / 2;
    let previousFrameTime = null;

    window.addEventListener("keydown", (event) => {
      if (event.key.startsWith("Arrow")) {
        event.preventDefault();
        if (event.key !== "ArrowDown") {
          pressedKeys.add(event.key);
        }
      }
    });

    window.addEventListener("keyup", (event) => {
      pressedKeys.delete(event.key);
    });

    window.addEventListener("blur", () => {
      pressedKeys.clear();
    });

    function drawInvaders(frameTime) {
      const pose = Math.floor(frameTime / 320) % 2;

      for (let row = 0; row < invaderFrames.length; row++) {
        const sprite = invaderFrames[row][pose];
        context.fillStyle = invaderColors[row];

        for (let column = 0; column < invaderColumns; column++) {
          if (!invaders[row][column]) {
            continue;
          }

          const x = formationX + column * (invaderWidth + invaderGapX);
          const y = formationY + row * (invaderHeight + invaderGapY);

          for (let pixelY = 0; pixelY < sprite.length; pixelY++) {
            for (let pixelX = 0; pixelX < sprite[pixelY].length; pixelX++) {
              if (sprite[pixelY][pixelX] === "#") {
                context.fillRect(
                  x + pixelX * invaderCellSize,
                  y + pixelY * invaderCellSize,
                  invaderCellSize,
                  invaderCellSize
                );
              }
            }
          }

          context.fillStyle = invaderEyeColors[row];
          context.fillRect(x + 6, y + 9, invaderCellSize, invaderCellSize);
          context.fillRect(x + 15, y + 9, invaderCellSize, invaderCellSize);
          context.fillStyle = invaderColors[row];
        }
      }
    }

    function drawBarriers() {
      context.fillStyle = "#69d57b";
      for (const barrier of barriers) {
        for (let row = 0; row < barrier.cells.length; row++) {
          for (let column = 0; column < barrier.cells[row].length; column++) {
            if (barrier.cells[row][column]) {
              context.fillRect(
                barrier.x + column * barrierCellSize,
                barrier.y + row * barrierCellSize,
                barrierCellSize,
                barrierCellSize
              );
            }
          }
        }
      }
    }

    function hitBarrier(bullet) {
      const bulletLeft = bullet.x - bullet.width / 2;
      const bulletRight = bullet.x + bullet.width / 2;
      const bulletBottom = bullet.y + bullet.height;

      for (const barrier of barriers) {
        for (let row = 0; row < barrier.cells.length; row++) {
          for (let column = 0; column < barrier.cells[row].length; column++) {
            if (!barrier.cells[row][column]) {
              continue;
            }

            const cellLeft = barrier.x + column * barrierCellSize;
            const cellTop = barrier.y + row * barrierCellSize;
            if (
              bulletLeft < cellLeft + barrierCellSize &&
              bulletRight > cellLeft &&
              bullet.y < cellTop + barrierCellSize &&
              bulletBottom > cellTop
            ) {
              barrier.cells[row][column] = false;
              return true;
            }
          }
        }
      }
      return false;
    }

    function firePlayerBullet() {
      playerBullets.push({
        x: shipX + shipWidth / 2,
        y: shipY - 22,
        width: 16,
        height: 22
      });
    }

    function fireInvaderBullet() {
      for (let offset = 0; offset < invaderColumns; offset++) {
        const column = (nextShooterColumn + offset) % invaderColumns;

        for (let row = invaders.length - 1; row >= 0; row--) {
          if (invaders[row][column]) {
            invaderBullets.push({
              x: formationX + column * (invaderWidth + invaderGapX) + invaderWidth / 2,
              y: formationY + row * (invaderHeight + invaderGapY) + invaderHeight,
              width: 16,
              height: 22
            });
            nextShooterColumn = (column + 1) % invaderColumns;
            return;
          }
        }
      }
    }

    function getInvaderFireInterval() {
      let remainingInvaders = 0;
      for (const row of invaders) {
        remainingInvaders += row.filter(Boolean).length;
      }

      const defeatedInvaders = invaderFrames.length * invaderColumns - remainingInvaders;
      return Math.max(
        minimumInvaderFireInterval,
        invaderFireInterval - defeatedInvaders * invaderFireSpeedupPerKill
      );
    }

    function updateBullets(elapsedTime) {
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const bullet = playerBullets[i];
        bullet.y -= playerBulletSpeed * elapsedTime;
        let hitInvader = false;

        for (let row = 0; row < invaders.length && !hitInvader; row++) {
          for (let column = 0; column < invaderColumns; column++) {
            if (!invaders[row][column]) {
              continue;
            }

            const invaderX = formationX + column * (invaderWidth + invaderGapX);
            const invaderY = formationY + row * (invaderHeight + invaderGapY);
            if (
              bullet.x >= invaderX + invaderHitboxInsetX &&
              bullet.x <= invaderX + invaderWidth - invaderHitboxInsetX &&
              bullet.y <= invaderY + invaderHeight - invaderHitboxInsetY &&
              bullet.y + bullet.height >= invaderY + invaderHitboxInsetY
            ) {
              invaders[row][column] = false;
              score += 1;
              hitInvader = true;
              break;
            }
          }
        }

        if (hitInvader || bullet.y + bullet.height < 0) {
          playerBullets.splice(i, 1);
        }
      }

      for (let i = invaderBullets.length - 1; i >= 0; i--) {
        const bullet = invaderBullets[i];
        bullet.y += invaderBulletSpeed * elapsedTime;

        if (hitBarrier(bullet)) {
          invaderBullets.splice(i, 1);
        } else if (
          bullet.x + bullet.width / 2 >= shipX &&
          bullet.x - bullet.width / 2 <= shipX + shipWidth &&
          bullet.y + bullet.height >= shipY &&
          bullet.y <= shipY + shipHeight
        ) {
          playerLives = Math.max(0, playerLives - 1);
          gameOver = playerLives === 0;
          invaderBullets.splice(i, 1);
        } else if (bullet.y > canvas.height) {
          invaderBullets.splice(i, 1);
        }
      }
    }

    function drawFartBullet(bullet, color, trailDirection) {
      const centerY = bullet.y + bullet.height / 2;
      context.fillStyle = color;
      context.beginPath();
      context.arc(bullet.x, centerY, 5, 0, Math.PI * 2);
      context.arc(bullet.x - 4, centerY + 2, 3, 0, Math.PI * 2);
      context.arc(bullet.x + 4, centerY + 2, 3, 0, Math.PI * 2);
      context.arc(bullet.x, centerY + 4, 3.5, 0, Math.PI * 2);
      context.fill();

      context.fillStyle = "#d9ff9d";
      context.beginPath();
      context.arc(bullet.x - 6, centerY + trailDirection * 7, 2, 0, Math.PI * 2);
      context.arc(bullet.x + 6, centerY + trailDirection * 10, 1.5, 0, Math.PI * 2);
      context.fill();
    }

    function drawBullets() {
      for (const bullet of playerBullets) {
        drawFartBullet(bullet, "#8dff54", 1);
      }

      for (const bullet of invaderBullets) {
        drawFartBullet(bullet, "#b56cff", -1);
      }
    }

    function drawLives() {
      for (let i = 0; i < 3; i++) {
        context.fillStyle = i < playerLives ? "#ff4f72" : "#542832";
        const x = 16 + i * 28;
        context.beginPath();
        context.moveTo(x + 10, 34);
        context.bezierCurveTo(x + 7, 31, x, 26, x, 21);
        context.bezierCurveTo(x, 14, x + 8, 12, x + 10, 18);
        context.bezierCurveTo(x + 13, 12, x + 20, 14, x + 20, 21);
        context.bezierCurveTo(x + 20, 26, x + 13, 31, x + 10, 34);
        context.fill();
      }
    }

    function drawScore() {
      context.save();
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = "bold 28px monospace";
      context.fillStyle = "#ffe66d";
      context.shadowColor = "#ffb52e";
      context.shadowBlur = 12;
      context.fillText(`SCORE ${String(score).padStart(4, "0")}`, canvas.width / 2, 30);
      context.restore();
    }

    function animate(frameTime) {
      const elapsedTime = previousFrameTime === null
        ? 0
        : Math.min((frameTime - previousFrameTime) / 1000, 0.05);
      previousFrameTime = frameTime;

      if (!gameOver) {
        if (pressedKeys.has("ArrowLeft")) {
          shipX -= shipSpeed * elapsedTime;
        }
        if (pressedKeys.has("ArrowRight")) {
          shipX += shipSpeed * elapsedTime;
        }
        shipX = Math.max(0, Math.min(canvas.width - shipWidth, shipX));

        formationX += formationDirection * invaderSpeed * elapsedTime;
        if (formationX <= 0) {
          formationX = 0;
          formationDirection = 1;
          formationY += invaderStepDown;
        } else if (formationX + formationWidth >= canvas.width) {
          formationX = canvas.width - formationWidth;
          formationDirection = -1;
          formationY += invaderStepDown;
        }

        playerFireTimer += elapsedTime;
        if (pressedKeys.has("ArrowUp") && playerFireTimer >= playerFireInterval) {
          firePlayerBullet();
          playerFireTimer = 0;
        } else if (!pressedKeys.has("ArrowUp")) {
          playerFireTimer = playerFireInterval;
        }

        invaderFireTimer += elapsedTime;
        if (invaderFireTimer >= getInvaderFireInterval()) {
          fireInvaderBullet();
          invaderFireTimer = 0;
        }

        updateBullets(elapsedTime);
      }

      context.clearRect(0, 0, canvas.width, canvas.height);
      drawInvaders(frameTime);
      drawBarriers();
      drawBullets();
      drawScore();
      context.fillStyle = "#fff";
      context.fillRect(shipX, shipY, shipWidth, shipHeight);
      drawLives();
      if (gameOver) {
        context.fillStyle = "#ff4f72";
        context.font = "bold 32px monospace";
        context.textAlign = "center";
        context.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
      }
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
